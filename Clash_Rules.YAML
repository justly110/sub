port: 7890
allow-lan: false
bind-address: "*"
mode: rule
log-level: info
ipv6: false               # 建议先关掉客户端全局 ipv6，避免 ipv4/ipv6 双栈竞争抢跑导致断流
external-controller: 127.0.0.1:9090

# 🔴 关键改动 1：关闭 TCP 并发，避免看油管时短时间内瞬间突发大量并发 TCP 握手触发移动出口封禁
tcp-concurrent: false

unified-delay: true

# 🔴 关键改动 2：关闭 TCP Fast Open，防止因跨国跨网中间设备不支持导致握手包丢失或 0B 假死
fast-open: false

# ==================== 配置文件缓存 ====================
profile:
  store-selected: true
  store-fake-ip: true

# ==================== 流量嗅探器 Sniffer ====================
sniffer:
  enable: true
  override-destination: true
  sniff:
    tls:
      ports:
        - 443
        - 8443
    http:
      ports:
        - 80
        - 8080-8880
      override-destination: true
  force-domain:
    - "+.netflix.com"
    - "+.nflxvideo.net"
    - "+.amazonaws.com"
    - "+.media.dssott.com"
  skip-domain:
    - "+.apple.com"
    - "Mijia Cloud"
    - "dlg.io.mi.com"
    - "+.oray.com"
    - "+.sunlogin.net"
    - "+.push.apple.com"
  parse-pure-ip: true
  force-dns-mapping: true

# ==================== 进阶 DNS 设置 ====================
dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  respect-rules: true  # 开启：让海外 DoH 安全地走代理，防止国内 DNS 污染
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.localhost'
    - '*.home.arpa'
    - 'captive.apple.com'
    - 'time.apple.com'
    - 'time.*.apple.com'
    - 'time.*.com'
    - 'time.*.gov'
    - 'time.*.edu.cn'
    - 'ntp.*.com'
    # 让国内网站与苹果服务强制返回真实 IP（配合 rule-set 属性）
    - 'rule-set:cn'
    - 'rule-set:private'
  
  # 💥 1. 基础 DNS：必须使用传统实体 IP（不可改动）
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 💥 2. 节点专用 DNS（全部使用 IP 型 DoH，免除任何域名解析，极速启动）
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query # 腾讯 DNSPod 的官方 DoH IP（免解析 doh.pub）

  # 💥 3. 域名特殊分流（国内、苹果独立优化）
  nameserver-policy:
    # 国内直连网站
    "rule-set:cn":
      - https://223.5.5.5/dns-query
      - https://doh.pub/dns-query

    # 苹果服务
    "rule-set:apple":
      - https://223.5.5.5/dns-query
      - https://doh.pub/dns-query

  # 💥 4. 国外网站兜底 DNS（推荐使用海外顶级 IP 型 DoH，自动走代理，防污染且速度最快）
  nameserver:
    - https://8.8.8.8/dns-query
    - https://1.1.1.1/dns-query

# ==================================================
# 代理节点设置
# ==================================================
proxies:

proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ⚡ 自动选择
      - 👆 手动选择

  - name: 👆 手动选择
    type: select
    proxies:

  - name: ⚡ 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:

  - name: 💬 AI 服务
    type: select
    # (?i) 忽略大小写；排除港、HK、Hong Kong
    filter: "(?i)^(?!.*(港|hk|hong.*kong)).*$"
    include-all: true
    proxies:
      - 🚀 节点选择    # 默认跟随主控节点（最省心）

  - name: 📹 油管视频
    type: select
    proxies:
      - 🚀 节点选择    # 默认跟随主控节点（最省心）

  - name: 🔎 谷歌服务
    type: select
    proxies:
      - 🚀 节点选择

  - name: 💻 github
    type: select
    proxies:
      - 🚀 节点选择
      - DIRECT

  - name: 🍎 苹果服务
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择

  - name: 🌐 非中国
    type: select
    proxies:
      - 🚀 节点选择
      - DIRECT

  - name: 🇨🇳 国内服务
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择

  - name: 🏠 私有网络
    type: select
    proxies:
      - DIRECT

  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 节点选择
      - DIRECT

# ==================================================
# 规则集 Rule Providers (采用 MetaCubeX meta 格式优化)
# ==================================================
rule-providers:
  ai-!cn:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/justly110/meta-rules-dat/meta/geo/geosite/category-ai-!cn.mrs"
    path: ./ruleset/ai-!cn.mrs
    interval: 86400

  private:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/justly110/meta-rules-dat/meta/geo/geosite/private.mrs"
    path: ./ruleset/private.mrs
    interval: 86400

  private-ip:
    type: http
    behavior: ipcidr
    format: mrs
    url: "https://raw.githubusercontent.com/justly110/meta-rules-dat/meta/geo/geoip/private.mrs"
    path: ./ruleset/private-ip.mrs
    interval: 86400

  youtube:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/justly110/meta-rules-dat/meta/geo/geosite/youtube.mrs"
    path: ./ruleset/youtube.mrs
    interval: 86400

  google:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/justly110/meta-rules-dat/meta/geo/geosite/google.mrs"
    path: ./ruleset/google.mrs
    interval: 86400

  github:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/justly110/meta-rules-dat/meta/geo/geosite/github.mrs"
    path: ./ruleset/github.mrs
    interval: 86400

  apple:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/justly110/meta-rules-dat/meta/geo/geosite/apple.mrs"
    path: ./ruleset/apple.mrs
    interval: 86400

  geolocation-non-cn:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/justly110/meta-rules-dat/meta/geo/geosite/geolocation-!cn.mrs"
    path: ./ruleset/geolocation-non-cn.mrs
    interval: 86400

  cn:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/justly110/meta-rules-dat/meta/geo/geosite/cn.mrs"
    path: ./ruleset/cn.mrs
    interval: 86400

  cn-ip:
    type: http
    behavior: ipcidr
    format: mrs
    url: "https://raw.githubusercontent.com/justly110/meta-rules-dat/meta/geo/geoip/cn.mrs"
    path: ./ruleset/cn-ip.mrs
    interval: 86400

# ==================================================
# 流量路由 Rules
# ==================================================
rules:
  - AND,((NETWORK,udp),(DST-PORT,443)),REJECT
  # 1. 广告与内网
  - RULE-SET,private,🏠 私有网络
  - RULE-SET,private-ip,🏠 私有网络,no-resolve

  # 2. 强制代理业务 (专属 AI 规则集)
  - RULE-SET,ai-!cn,💬 AI 服务

  # 3. 服务分流
  - RULE-SET,youtube,📹 油管视频     # 👈 必须在 google 之前
  - RULE-SET,google,🔎 谷歌服务
  - RULE-SET,github,💻 github

  # 4. Apple 服务分流
  - RULE-SET,apple,🍎 苹果服务

  # 5. 非中国网站：走代理
  - RULE-SET,geolocation-non-cn,🌐 非中国

  # 6. 中国国内域名与 IP：走直连
  - RULE-SET,cn,🇨🇳 国内服务
  - RULE-SET,cn-ip,🇨🇳 国内服务,no-resolve

  # 7. 国外网站兜底：全走代理
  - MATCH,🐟 漏网之鱼
